# ─────────────────────────────────────────────────────────────────────────
# Cloud Build — kuza-backend (API + DB migrations).
# Trigger is SCOPED to backend/** (see CLOUDBUILD.md), so this runs only when
# backend files change. Flow: build → push → migrate (to completion) → deploy.
# A failed migration fails the build, so a bad migration never serves traffic.
# ─────────────────────────────────────────────────────────────────────────
substitutions:
  _REGION: europe-west1
  _AR_REPO: kuza                       # Artifact Registry docker repo
  _SERVICE: kuza-backend
  _CLOUD_SQL_INSTANCE: ""              # PROJECT:REGION:INSTANCE  (set on the trigger)
  _DB_NAME: erp_db
  _LANDLORD_DB_NAME: erp_landlord
  _FRONTEND_URL: ""                    # comma-sep portal origins for CORS
  _AI_PROVIDER: anthropic

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$SHORT_SHA'

steps:
  # 1) Build the backend image (context = backend/)
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$SHORT_SHA'
      - backend

  # 2) Push to Artifact Registry
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$SHORT_SHA'

  # 3) Run pending migrations to completion (landlord + public template + every
  #    tenant schema). --wait blocks; a failure aborts the build before deploy.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        gcloud run jobs deploy backend-migrate \
          --image '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$SHORT_SHA' \
          --region ${_REGION} \
          --command node --args dist/scripts/run-migrations.js \
          --set-cloudsql-instances ${_CLOUD_SQL_INSTANCE} \
          --set-env-vars DB_HOST=/cloudsql/${_CLOUD_SQL_INSTANCE},DB_NAME=${_DB_NAME},LANDLORD_DB_NAME=${_LANDLORD_DB_NAME} \
          --set-secrets DB_USERNAME=DB_USERNAME:latest,DB_PASSWORD=DB_PASSWORD:latest \
          --max-retries 0 --task-timeout 900 --quiet
        gcloud run jobs execute backend-migrate --region ${_REGION} --wait --quiet

  # 4) Deploy the service. Runtime config is enforced here on EVERY deploy so it
  #    can't drift from a console edit. 1Gi RAM (Node+Nest+sharp OOM at 128Mi);
  #    min-instances 1 so provider payment webhooks never hit a cold start.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        gcloud run deploy ${_SERVICE} \
          --image '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$SHORT_SHA' \
          --region ${_REGION} --platform managed --allow-unauthenticated \
          --add-cloudsql-instances ${_CLOUD_SQL_INSTANCE} \
          --port 8080 --memory 1Gi --cpu 1 \
          --min-instances 1 --max-instances 4 --concurrency 80 --timeout 300 \
          --set-env-vars NODE_ENV=production,DB_SYNCHRONIZE=false,DB_HOST=/cloudsql/${_CLOUD_SQL_INSTANCE},DB_NAME=${_DB_NAME},LANDLORD_DB_NAME=${_LANDLORD_DB_NAME},AI_PROVIDER=${_AI_PROVIDER},FRONTEND_URL=${_FRONTEND_URL} \
          --set-secrets DB_USERNAME=DB_USERNAME:latest,DB_PASSWORD=DB_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,SUPER_ADMIN_EMAIL=SUPER_ADMIN_EMAIL:latest
