# ─────────────────────────────────────────────────────────────────────────
# Cloud Build — kuza-ai (self-hosted Llama via Ollama).
# Trigger SCOPED to ai/** (see CLOUDBUILD.md), or run once by hand:
#   gcloud builds submit --config ai/cloudbuild.yaml .
#
# The image bakes the model, so the build is heavy — a bigger builder and a
# long timeout are set below.
# ─────────────────────────────────────────────────────────────────────────
substitutions:
  _REGION: europe-west1
  _AR_REPO: kuza
  _SERVICE: kuza-ai
  _MODEL: llama3.2:3b

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 3000s

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ai:$SHORT_SHA'

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - ai/Dockerfile
      - --build-arg
      - 'MODEL=${_MODEL}'
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ai:$SHORT_SHA'
      - ai

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ai:$SHORT_SHA'

  # Private by default — an open LLM endpoint is a cost-abuse risk. The backend
  # calls it as a service (grant its service account roles/run.invoker and send
  # an ID token — see ai/README.md). CPU deploy. See README for the GPU variant.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        gcloud run deploy ${_SERVICE} \
          --image '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ai:$SHORT_SHA' \
          --region ${_REGION} --platform managed \
          --no-allow-unauthenticated \
          --port 8080 --memory 8Gi --cpu 4 \
          --min-instances 0 --max-instances 1 --concurrency 4 --timeout 600
