# ─────────────────────────────────────────────────────────────────────────
# Deploy to Cloud Run — controlled entirely from git.
#
# On push to `main`, only the services whose files changed are rebuilt and
# deployed (the per-service scoping lives in the `changes` job below, in this
# file — not in the Cloud console). A `website/**` push deploys ONLY the website.
#
# Deploy uses `gcloud run services update --image`, so the env vars, Cloud SQL
# connection and secrets already set on each service are preserved — the
# pipeline only swaps the image. GitHub authenticates to Google Cloud KEYLESSLY
# via Workload Identity Federation — set WIF_PROVIDER + WIF_SERVICE_ACCOUNT
# secrets (no service-account key; the org blocks key creation by policy).
#
# A failed step fails the job, so nothing deploys unless the whole job passes.
# To add tests: add a `test` job and make each deploy job `needs: [changes, test]`
# so a failing test blocks every deploy.
# ─────────────────────────────────────────────────────────────────────────
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {} # manual "deploy everything" button

permissions:
  contents: read
  id-token: write # required for keyless Workload Identity Federation

env:
  PROJECT_ID: pave-504011
  REGION: europe-west1
  AR: europe-west1-docker.pkg.dev/pave-504011/cloud-run-source-deploy
  # NEXT_PUBLIC_* are baked at BUILD time. Each build reads the value from its own
  # Cloud Run service's env (managed on GCP); if unset, it falls back to the LIVE
  # URL of the target service, fetched from Cloud Run at build time — nothing about
  # the URL is hardcoded, so it survives project / region / redeploy changes.

jobs:
  # Per-service change detection — this is the deployment control, in git.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      user-portal: ${{ steps.f.outputs.user-portal }}
      admin-portal: ${{ steps.f.outputs.admin-portal }}
      website: ${{ steps.f.outputs.website }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend:
              - 'backend/**'
            user-portal:
              - 'user-portal/**'
            admin-portal:
              - 'admin-portal/**'
            website:
              - 'website/**'

  # ── Add test / lint jobs here later, then add them to each deploy's `needs` ──

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud config set project "$PROJECT_ID" --quiet
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build, push & deploy
        run: |
          IMG="$AR/kuza-backend:${{ github.sha }}"
          docker build -f backend/Dockerfile -t "$IMG" backend
          docker push "$IMG"
          gcloud run services update kuza-backend --image "$IMG" --region "$REGION" --quiet

  user-portal:
    needs: changes
    if: needs.changes.outputs.user-portal == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud config set project "$PROJECT_ID" --quiet
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build, push & deploy
        run: |
          API_URL=$(gcloud run services describe kuza-user-portal --region="$REGION" --format=json 2>/dev/null \
            | jq -r '(.spec.template.spec.containers[0].env // [])[] | select(.name=="NEXT_PUBLIC_API_URL") | .value' 2>/dev/null | head -1)
          API_URL="${API_URL:-$(gcloud run services describe kuza-backend --region="$REGION" --format='value(status.url)' 2>/dev/null)}"
          echo "Baking NEXT_PUBLIC_API_URL=$API_URL"
          IMG="$AR/kuza-user-portal:${{ github.sha }}"
          docker build -f user-portal/Dockerfile --build-arg NEXT_PUBLIC_API_URL="$API_URL" -t "$IMG" user-portal
          docker push "$IMG"
          gcloud run services update kuza-user-portal --image "$IMG" --region "$REGION" --quiet

  admin-portal:
    needs: changes
    if: needs.changes.outputs.admin-portal == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud config set project "$PROJECT_ID" --quiet
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build, push & deploy
        run: |
          API_URL=$(gcloud run services describe kuza-admin-portal --region="$REGION" --format=json 2>/dev/null \
            | jq -r '(.spec.template.spec.containers[0].env // [])[] | select(.name=="NEXT_PUBLIC_API_URL") | .value' 2>/dev/null | head -1)
          API_URL="${API_URL:-$(gcloud run services describe kuza-backend --region="$REGION" --format='value(status.url)' 2>/dev/null)}"
          echo "Baking NEXT_PUBLIC_API_URL=$API_URL"
          IMG="$AR/kuza-admin-portal:${{ github.sha }}"
          docker build -f admin-portal/Dockerfile --build-arg NEXT_PUBLIC_API_URL="$API_URL" -t "$IMG" admin-portal
          docker push "$IMG"
          gcloud run services update kuza-admin-portal --image "$IMG" --region "$REGION" --quiet

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud config set project "$PROJECT_ID" --quiet
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build, push & deploy
        run: |
          APP_URL=$(gcloud run services describe kuza-website --region="$REGION" --format=json 2>/dev/null \
            | jq -r '(.spec.template.spec.containers[0].env // [])[] | select(.name=="NEXT_PUBLIC_APP_URL") | .value' 2>/dev/null | head -1)
          APP_URL="${APP_URL:-$(gcloud run services describe kuza-user-portal --region="$REGION" --format='value(status.url)' 2>/dev/null)}"
          echo "Baking NEXT_PUBLIC_APP_URL=$APP_URL"
          IMG="$AR/kuza-website:${{ github.sha }}"
          docker build -f website/Dockerfile --build-arg NEXT_PUBLIC_APP_URL="$APP_URL" -t "$IMG" website
          docker push "$IMG"
          gcloud run services update kuza-website --image "$IMG" --region "$REGION" --quiet
