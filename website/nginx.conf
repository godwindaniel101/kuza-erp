server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # HTML: always revalidate so copy/pricing changes ship immediately.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Static assets: short cache (marketing site, iterated often).
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Clean URLs: /restaurant -> restaurant.html, /pricing -> pricing.html, etc.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
