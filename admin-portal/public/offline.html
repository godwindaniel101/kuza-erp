<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kuza — offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0c10; color: #fff; font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
    .mark { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #4f46e5, #7c6cf0); display: grid; place-items: center; font-size: 28px; font-weight: 800; margin: 0 auto 20px; }
    h1 { font-size: 22px; margin: 0 0 10px; letter-spacing: -0.01em; }
    p { color: rgba(255,255,255,0.65); font-size: 15px; max-width: 340px; margin: 0 auto; line-height: 1.6; }
    button { margin-top: 22px; background: #4f46e5; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <div class="mark">K</div>
    <h1>You're offline</h1>
    <p>No connection right now. Pages you've opened recently are still available — anything you couldn't reach will load the moment you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
