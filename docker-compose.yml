
services:
  postgres:
    image: postgres:15-alpine
    container_name: erp_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-erp_db}
    ports:
      - "${DB_PORT:-4433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-landlord.sql:/docker-entrypoint-initdb.d/01-init-landlord.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_network

  backend:
    build:
      context: ./backend
      dockerfile: ${DOCKERFILE_BACKEND:-Dockerfile.dev}
    container_name: erp_backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-erp_db}
      DB_LANDLORD_NAME: ${DB_LANDLORD_NAME:-erp_landlord}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:5001/api/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5001}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@erp.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ERP Platform}
      # --- AI / LLM provider (provider-agnostic; switch by config, not code) ---
      # AI_PROVIDER selects the backend:
      #   'ollama'    (default) — LOCAL, OpenAI-compatible /chat/completions
      #                (Docker Model Runner / Ollama / llama.cpp / LM Studio)
      #   'openai'    — OpenAI / ChatGPT (or any OpenAI-compatible API)
      #   'anthropic' — Claude
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      # Local model (default = Docker Model Runner):
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://model-runner.docker.internal/engines/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-ai/llama3.2:latest}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-30000}
      # OpenAI / ChatGPT (set AI_PROVIDER=openai + OPENAI_API_KEY):
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      # Anthropic / Claude (set AI_PROVIDER=anthropic + ANTHROPIC_API_KEY):
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      # Optional generic overrides (fallback for any provider):
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-4001}:4001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/src/i18n:/app/src/i18n
      - ./backend/src/modules/notifications/templates:/app/src/modules/notifications/templates
      - backend_uploads:/app/uploads
      - /app/node_modules
    networks:
      - erp_network
    restart: unless-stopped
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: ${DOCKERFILE_FRONTEND:-Dockerfile.dev}
    container_name: erp_frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4001}
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "${FRONTEND_PORT:-5001}:3000"
    depends_on:
      - backend
    networks:
      - erp_network
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- -H 0.0.0.0

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: erp_website
    ports:
      - "${WEBSITE_PORT:-8080}:80"
    networks:
      - erp_network
    restart: unless-stopped

  # Optional: local Llama (OpenAI-compatible) LLM backend.
  # This service is opt-in — the backend does not depend on it, so nothing
  # breaks if you never start it. To use it as the AI backend:
  #   1) docker compose up -d ollama
  #   2) docker exec erp_ollama ollama pull llama3.1
  #   3) set AI_PROVIDER=openai, AI_BASE_URL=http://ollama:11434/v1,
  #      AI_MODEL=llama3.1 (see the backend service env above) and restart backend.
  ollama:
    image: ollama/ollama:latest
    container_name: erp_ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - erp_network
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:
  ollama_data:

networks:
  erp_network:
    driver: bridge

